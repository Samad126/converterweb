name: Deploy Frontend

on:
  push:
    branches: [master]
  # Lets you re-run a deploy without pushing a commit - the useful case being a
  # server-side fix that needs the same deploy applied again.
  workflow_dispatch:

# Two pushes in quick succession would otherwise run two `docker compose up
# --build` calls against the same checkout at the same time. Serialise them,
# and let an in-flight deploy finish rather than cancelling it half-applied.
concurrency:
  group: deploy-converterweb
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The build happens on the server, so this only bounds a hang. A cold build
    # - `npm ci` plus `next build` - is a few minutes at most.
    timeout-minutes: 20

    steps:
      - name: Deploy converterweb to server
        env:
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -e ssh -p 44544 -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e

            APP_DIR=/pool/www/converter.alakbaroff.com/frontend

            # The checkout is owned by whatever user first cloned it, which is
            # not necessarily the one this deploy logs in as. Without this, git
            # refuses to touch it: "detected dubious ownership in repository".
            git config --global --add safe.directory "$APP_DIR"
            git -C "$APP_DIR" pull origin master

            # --- The one prerequisite this deploy cannot supply ----------------
            #
            # `.env` holds NEXT_PUBLIC_CONVERTER_BASE_URL, and it is GITIGNORED
            # - so it is not in the clone, and a fresh server does not have it.
            # It also has to be read at BUILD time, because that variable is
            # inlined into the browser bundle rather than read at startup.
            #
            # Checked here, by name, rather than left to compose's own
            # `${VAR:?}` guard: that guard fires too, but its message points at
            # a variable, and the fix is a file on the server. This says which
            # file and where.
            if [ ! -f "$APP_DIR/.env" ]; then
              echo "deploy failed: $APP_DIR/.env is missing." >&2
              echo "Nothing in the repository creates it - it is gitignored on purpose." >&2
              echo "Create it with:  NEXT_PUBLIC_CONVERTER_BASE_URL=https://converterapi.alakbaroff.com" >&2
              exit 1
            fi

            # --- Rebuild and replace the web service only ----------------------
            #
            # `--env-file` is explicit rather than relying on compose finding
            # `.env` beside the compose file. Compose v1 looked for it in the
            # working directory and v2 in the project directory, and this
            # script runs from neither; passing the path removes the question.
            #
            # --build is not optional. It is what re-runs `next build` with the
            # current base URL, and a `up -d` without it would leave the old
            # bundle - still pointing at whatever host it was built with -
            # serving happily.
            docker compose \
              --env-file "$APP_DIR/.env" \
              -f "$APP_DIR/docker-compose.yml" \
              up -d --no-deps --build converterweb

            # --- Wait for it to actually answer --------------------------------
            #
            # `up -d` returns once the container is *started*, which is not the
            # same as ready - and it reports success just as happily for a
            # container that is about to crashloop. Polling the published port
            # is what separates a good deploy from a dead one.
            #
            # 24 x 5s = 120s. The image is a static server and Next binds in
            # milliseconds, so this is generous; the wall-clock cost of a deploy
            # is the build above, not this loop.
            #
            # A flag and a `break`, deliberately NOT `exit 0` inside the loop.
            # This script arrives on ssh's stdin: exiting the shell while the
            # heredoc still has unread lines left makes ssh return non-zero, so
            # a deploy that succeeded reports as a failed step. Running to the
            # natural end keeps the exit status honest.
            healthy=0
            for i in $(seq 1 24); do
              if curl -fsS -o /dev/null http://127.0.0.1:3011/ 2>/dev/null; then
                echo "converterweb answering after $((i * 5))s"
                healthy=1
                break
              fi
              sleep 5
            done

            if [ "$healthy" -ne 1 ]; then
              echo "converterweb did not answer within 120s" >&2
              docker compose --env-file "$APP_DIR/.env" -f "$APP_DIR/docker-compose.yml" \
                logs --tail 100 converterweb >&2
              exit 1
            fi

            # --- Assert the bundle calls the API we think it does --------------
            #
            # Serving a page is not the same as serving the RIGHT page, and this
            # is the one failure the check above cannot see. The base URL is
            # inlined into a client chunk at build time (see Dockerfile), so a
            # deploy that built with a stale or empty value publishes a bundle
            # pointing at converter.alakbaroff.com - which answers, looks fine,
            # and then reports the service as down, because that host serves the
            # page and not the API.
            #
            # An empty base URL is a SUPPORTED deployment, so this mistake does
            # not throw anywhere. It has to be asserted.
            expected=$(grep '^NEXT_PUBLIC_CONVERTER_BASE_URL=' "$APP_DIR/.env" \
              | tail -1 | cut -d= -f2- | tr -d '"\r' | sed 's/[[:space:]]*$//')

            if [ -z "$expected" ]; then
              echo "deploy failed: NEXT_PUBLIC_CONVERTER_BASE_URL is empty in $APP_DIR/.env" >&2
              echo "If that is intentional the deployment is same-origin - but it is not" >&2
              echo "how this host is set up, so it is almost certainly a mistake." >&2
              exit 1
            fi

            # Walk the scripts the served HTML actually references. Checking the
            # files on disk instead would test the image, not the response -
            # and it would miss the copy of .next/static, whose failure mode is
            # an unstyled page with no JavaScript at all.
            html=$(curl -fsS http://127.0.0.1:3011/)
            found=0
            for chunk in $(printf '%s' "$html" | grep -o '/_next/static/[A-Za-z0-9/_.-]*\.js' | sort -u); do
              if curl -fsS "http://127.0.0.1:3011$chunk" | grep -qF "$expected"; then
                found=1
                break
              fi
            done

            if [ "$found" -ne 1 ]; then
              echo "deploy failed: the served bundle does not contain '$expected'." >&2
              echo "The image was built without this value, or from a stale bundle." >&2
              exit 1
            fi

            echo "converterweb deployed and serving a bundle pointed at $expected"
          EOF
